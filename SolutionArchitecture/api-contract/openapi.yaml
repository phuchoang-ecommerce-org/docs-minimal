components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Role denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Missing or non-owned resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State, stock or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        code: &id001
          type: string
        message: *id001
        correlationId: *id001
        fieldErrors:
          type: object
          additionalProperties: *id001
      required:
      - code
      - message
      - correlationId
    LoginRequest:
      type: object
      properties:
        login: *id001
        password:
          type: string
          format: password
      required:
      - login
      - password
    AuthTokens:
      type: object
      properties:
        accessToken: *id001
        tokenType:
          type: string
          const: Bearer
        expiresInSeconds:
          type: integer
      required:
      - accessToken
      - tokenType
      - expiresInSeconds
    RegisterRequest:
      type: object
      properties:
        login: *id001
        password:
          type: string
          format: password
        displayName: *id001
      required:
      - login
      - password
      - displayName
    Account:
      type: object
      properties:
        id: &id002
          type: string
          format: uuid
        login: *id001
        displayName: *id001
        role:
          type: string
          enum:
          - MEMBER
          - SELLER
          - ADMIN
      required:
      - id
      - login
      - role
    AccountUpdate:
      type: object
      properties:
        displayName: *id001
    Category:
      type: object
      properties:
        id: *id002
        name: *id001
      required:
      - id
      - name
    CategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - items
    ProductImage:
      type: object
      properties:
        id: *id002
        mode:
          type: string
          enum:
          - LINK
          - UPLOAD
        url:
          type:
          - string
          - 'null'
          format: uri
        contentPath:
          type:
          - string
          - 'null'
        altText: *id001
      required:
      - id
      - mode
      - altText
    Product:
      type: object
      properties:
        id: *id002
        sellerId: *id002
        name: *id001
        priceUsd: &id003
          type: string
          pattern: ^\d+\.\d{2}$
        stock:
          type: integer
          minimum: 0
        ratingAverage:
          type:
          - number
          - 'null'
          minimum: 1
          maximum: 5
        reviewCount:
          type: integer
          minimum: 0
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
      required:
      - id
      - sellerId
      - name
      - priceUsd
      - stock
      - reviewCount
      - images
    ProductList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
      required:
      - items
      - page
    Home:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required:
      - categories
      - products
    ProductWrite:
      type: object
      properties:
        name: *id001
        categoryId: *id002
        priceUsd: *id003
        published:
          type: boolean
      required:
      - name
      - categoryId
      - priceUsd
    ImageLinkCreate:
      type: object
      properties:
        url:
          type: string
          format: uri
        sourcePage:
          type: string
          format: uri
        licenseUrl:
          type: string
          format: uri
        altText: *id001
      required:
      - url
      - sourcePage
      - licenseUrl
      - altText
    ImageUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
        altText: *id001
      required:
      - file
      - altText
    StockUpdate:
      type: object
      properties:
        onHand:
          type: integer
          minimum: 0
      required:
      - onHand
    Stock:
      type: object
      properties:
        variantId: *id002
        onHand:
          type: integer
          minimum: 0
      required:
      - variantId
      - onHand
    CartLineWrite:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
      required:
      - quantity
    CartLine:
      type: object
      properties:
        variantId: *id002
        quantity:
          type: integer
          minimum: 1
        unitPriceUsd: *id003
      required:
      - variantId
      - quantity
    Cart:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/CartLine'
        totalUsd: *id003
      required:
      - lines
      - totalUsd
    CreateOrder:
      type: object
      properties:
        addressId: *id002
        voucherCode: *id001
        paymentMethod:
          type: string
          const: COD
      required:
      - addressId
      - paymentMethod
    SellerOrder:
      type: object
      properties:
        id: *id002
        sellerId: *id002
        paymentStatus:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAID
        totalUsd: *id003
      required:
      - id
      - sellerId
      - paymentStatus
      - totalUsd
    SellerOrderList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SellerOrder'
      required:
      - items
    Order:
      type: object
      properties:
        id: *id002
        memberId: *id002
        status:
          type: string
          enum:
          - PLACED
          - CANCELLED
        paymentStatus:
          type: string
          enum:
          - PENDING_PAYMENT
          - PAID
        totalUsd: *id003
        sellerOrders:
          type: array
          items:
            $ref: '#/components/schemas/SellerOrder'
      required:
      - id
      - memberId
      - status
      - paymentStatus
      - totalUsd
      - sellerOrders
    ReviewCreate:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          maxLength: 2000
      required:
      - rating
    ReviewUpdate:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text:
          type: string
          maxLength: 2000
    Review:
      type: object
      properties:
        id: *id002
        productId: *id002
        rating:
          type: integer
          minimum: 1
          maximum: 5
        text: *id001
        visible:
          type: boolean
      required:
      - id
      - productId
      - rating
      - visible
    ReviewList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        average:
          type:
          - number
          - 'null'
        count:
          type: integer
      required:
      - items
      - count
    SellerStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        reason: *id001
      required:
      - status
      - reason
    Seller:
      type: object
      properties:
        id: *id002
        status:
          type: string
      required:
      - id
      - status
    ReviewModeration:
      type: object
      properties:
        visible:
          type: boolean
        reason: *id001
      required:
      - visible
      - reason
    Report:
      type: object
      properties:
        orders:
          type: integer
        grossUsd: *id003
      required:
      - orders
      - grossUsd
    AuditEntry:
      type: object
      properties:
        id: *id002
        actorId: *id002
        action: *id001
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - actorId
      - action
      - createdAt
    AuditList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
      required:
      - items
    CategoryWrite:
      type: object
      properties:
        name:
          type: string
      required:
      - name
