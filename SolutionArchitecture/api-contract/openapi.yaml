      description: 'Atomically validates owned address, cartVersion, availability and optional voucher; snapshots
        prices/address/discounts, creates portions, decreases stock, consumes cart and audits. Scope Idempotency-Key
        by Member. Compare canonical request body (addressId, cartVersion, voucherCode, paymentMethod); same key/body
        reconstructs the original 201 response from immutable snapshots (PLACED, all portions PENDING_PAYMENT, paidAt
        null) before re-reading cart, address or voucher. Different body returns 409. Persist key/fingerprint with
        immutable order snapshots, never expire while order is retained. A failed transaction consumes no key. Concurrent
        same key waits for commit then replays. New key with stale cartVersion fails 409.


        Use case: UC-04. Errors: 400 INVALID_REQUEST; 401 AUTHENTICATION_REQUIRED; 403 ROLE_DENIED; 404 RESOURCE_NOT_FOUND;
        409 CART_CHANGED, EMPTY_CART, ITEM_UNAVAILABLE, STOCK_UNAVAILABLE, VOUCHER_INVALID, IDEMPOTENCY_CONFLICT;
        415 UNSUPPORTED_MEDIA_TYPE; 500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.'
