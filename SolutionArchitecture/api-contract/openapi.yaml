components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    guestCart:
      type: apiKey
      in: cookie
      name: guest_cart
      description: Opaque server session, HttpOnly; Secure in production; SameSite=Lax. Browser never chooses cart
        owner.
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/BadRequestProblem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: INVALID_CURSOR
            message: Invalid request
            correlationId: request-7cba
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnauthorizedProblem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: AUTHENTICATION_REQUIRED
            message: Authentication required or invalid credentials
            correlationId: request-7cba
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer challenge; never disclose credential details.
    Forbidden:
      description: Role, origin or Seller status denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ForbiddenProblem'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            code: ORIGIN_DENIED
            message: Role, origin or Seller status denied
            correlationId: request-7cba
    NotFound:
      description: Missing or non-owned resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NotFoundProblem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: RESOURCE_NOT_FOUND
            message: Missing or non-owned resource
            correlationId: request-7cba
    Conflict:
      description: State, version, uniqueness or checkout conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ConflictProblem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: CART_CHANGED
            message: State, version, uniqueness or checkout conflict
            correlationId: request-7cba
    PayloadTooLarge:
      description: Upload exceeds 5 MiB
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/PayloadTooLargeProblem'
          example:
            type: about:blank
            title: Content Too Large
            status: 413
            code: PAYLOAD_TOO_LARGE
            message: Upload exceeds 5 MiB
            correlationId: request-7cba
    UnsupportedMediaType:
      description: Unsupported request media type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/UnsupportedMediaTypeProblem'
          example:
            type: about:blank
            title: Unsupported Media Type
            status: 415
            code: UNSUPPORTED_MEDIA_TYPE
            message: Unsupported request media type
            correlationId: request-7cba
    InternalError:
      description: Unexpected failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalErrorProblem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            code: INTERNAL_ERROR
            message: Unexpected failure
            correlationId: request-7cba
    ServiceUnavailable:
      description: Database or required service unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ServiceUnavailableProblem'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            code: SERVICE_UNAVAILABLE
            message: Database or required service unavailable
            correlationId: request-7cba
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri
          const: about:blank
        title:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: integer
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 413
          - 415
          - 500
          - 503
        code:
          type: string
          enum:
          - AUTHENTICATION_REQUIRED
          - CART_CHANGED
