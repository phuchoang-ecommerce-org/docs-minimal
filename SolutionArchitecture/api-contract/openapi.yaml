openapi: 3.1.0
info:
  title: Minimal Marketplace API
  version: 0.2.0
  description: Implementation target for UC-01 through UC-10. Java 21 / Spring MVC / PostgreSQL. COD and USD only.
    See the contract index for scope decisions and implementation gates.
servers:
- url: http://localhost:8080
  description: Local development; replace per deployment
tags:
- name: Identity
  description: UC-03 credential and Member registration flows.
- name: Discovery
  description: UC-01 published product and category reads.
- name: Images
  description: UC-01 display and UC-06 owned product image writes.
- name: Reviews
  description: UC-01 public ratings and UC-08 eligible Member reviews.
- name: SellerCatalog
  description: UC-06 owned products, variants and stock.
- name: Cart
  description: UC-02 Guest/Member cart.
- name: Orders
  description: UC-04 checkout and UC-05 cancellation.
- name: SellerPayment
  description: UC-07 recording COD cash for owned portions.
- name: Administration
  description: UC-09 policy and UC-10 moderation/reports/audit.
paths:
  /auth/login:
    post:
      tags:
      - Identity
      summary: Log in
      operationId: logIn
      x-roles:
      - Guest
      x-use-case: UC-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
          headers:
            Set-Cookie:
              description: Expires the Guest cookie after successful Member cart consumption. No cookie is set for
                the access token.
              schema:
                type: string
              example: guest_cart=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=Lax
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Returns one access JWT and trusted account identity. For MEMBER, atomically consumes a valid
        Guest cart once and merges valid quantities; rejected variants are reported. Replayed consumed cookie never
        merges again. Seller/Admin login does not import a Guest cart. Invalid credentials return the same generic
        401. No refresh token.


        Use case: UC-03. Errors: 400 INVALID_REQUEST; 401 INVALID_CREDENTIALS; 415 UNSUPPORTED_MEDIA_TYPE; 500 INTERNAL_ERROR;
        503 SERVICE_UNAVAILABLE. When a Guest cookie is supplied, require an allowed Origin; otherwise return 403
        ORIGIN_DENIED. Invalidate consumed Guest cookie.'
      security:
      - {}
      - guestCart: []
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '401':
        - INVALID_CREDENTIALS
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
        '403':
        - ORIGIN_DENIED
      parameters:
      - name: Origin
        in: header
        required: false
        description: Required and checked against the allowlist when using a Guest cookie; optional for bearer-only
          or cookie-free credential requests.
        schema:
          type: string
          format: uri
  /accounts:
    post:
      tags:
      - Identity
      summary: Register member
      operationId: registerMember
      x-roles:
      - Guest
      x-use-case: UC-03
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              login: member@example.test
              password: long-test-password
              displayName: Member
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: 'Creates MEMBER only; role, status and sellerId are never accepted. Seller/Admin accounts use
        controlled provisioning, not public role selection.


        Use case: UC-03. Errors: 400 INVALID_REQUEST; 409 LOGIN_ALREADY_EXISTS; 415 UNSUPPORTED_MEDIA_TYPE; 500
        INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.'
      security: []
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '409':
        - LOGIN_ALREADY_EXISTS
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
  /categories:
    get:
      tags:
      - Discovery
      summary: List categories
      operationId: listCategories
      x-roles:
      - Guest
      - Member
      - Seller
      - Admin
      x-use-case: UC-01
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      security: []
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_CURSOR
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
      description: '


        Use case: UC-01. Errors: 400 INVALID_REQUEST, INVALID_CURSOR; 500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.'
  /products:
    get:
      tags:
      - Discovery
      summary: List products
      operationId: listProducts
      x-roles:
      - Guest
      - Member
      - Seller
      - Admin
      x-use-case: UC-01
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: categoryId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: minPrice
        in: query
        required: false
        schema:
          type: string
          pattern: ^(0|[1-9]\d{0,9})\.\d{2}$
          examples:
          - '12.50'
      - name: maxPrice
        in: query
        required: false
        schema:
          type: string
          pattern: ^(0|[1-9]\d{0,9})\.\d{2}$
          examples:
          - '12.50'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_CURSOR
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
      description: '


        Use case: UC-01. Errors: 400 INVALID_REQUEST, INVALID_CURSOR; 500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.
        q uses PostgreSQL simple full-text search (websearch_to_tsquery), not relevance pagination; filter products
        by variants within inclusive price bounds. minPrice must not exceed maxPrice. All public product/image/review
        reads require published product and active Seller; otherwise detail returns 404.'
  /products/{productId}:
    get:
      tags:
      - Discovery
      summary: Get product
      operationId: getProduct
      x-roles:
      - Guest
      - Member
      - Seller
      - Admin
      x-use-case: UC-01
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '404':
        - RESOURCE_NOT_FOUND
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
      description: '


        Use case: UC-01. Errors: 400 INVALID_REQUEST; 404 RESOURCE_NOT_FOUND; 500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.'
  /products/{productId}/images/{imageId}/content:
    get:
      tags:
      - Images
      summary: Get uploaded image
      operationId: getUploadedImage
      x-roles:
      - Guest
      - Member
      - Seller
      - Admin
      x-use-case: UC-01
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Uploaded image bytes from PostgreSQL
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '404':
        - RESOURCE_NOT_FOUND
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
      description: '


        Use case: UC-01. Errors: 400 INVALID_REQUEST; 404 RESOURCE_NOT_FOUND; 500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.
        Only UPLOAD images of published products from active Sellers. LINK IDs and mismatched product/image return
        404.'
  /products/{productId}/reviews:
    get:
      tags:
      - Reviews
      summary: List product reviews
      operationId: listProductReviews
      x-roles:
      - Guest
      - Member
      - Seller
      - Admin
      x-use-case: UC-01
      security: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_CURSOR
        '404':
        - RESOURCE_NOT_FOUND
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
      description: '


        Use case: UC-01. Errors: 400 INVALID_REQUEST, INVALID_CURSOR; 404 RESOURCE_NOT_FOUND; 500 INTERNAL_ERROR;
        503 SERVICE_UNAVAILABLE.'
    post:
      tags:
      - Reviews
      summary: Create product review
      operationId: createProductReview
      x-roles:
      - Member
      x-use-case: UC-08
      security: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
            example:
              rating: 5
              text: Fits as described.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: 'Requires that this Member owns a PAID seller portion containing the product. Aggregate order
        need not be fully Paid. One active review per Member/product, including hidden reviews. Ineligible purchase
        or duplicate active review returns 409.


        Use case: UC-08. Errors: 400 INVALID_REQUEST; 404 RESOURCE_NOT_FOUND; 409 REVIEW_NOT_ELIGIBLE, REVIEW_ALREADY_EXISTS;
        415 UNSUPPORTED_MEDIA_TYPE; 500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.'
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '404':
        - RESOURCE_NOT_FOUND
        '409':
        - REVIEW_NOT_ELIGIBLE
        - REVIEW_ALREADY_EXISTS
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
  /me/reviews/{reviewId}:
    patch:
      tags:
      - Reviews
      summary: Update own review
      operationId: updateOwnReview
      x-roles:
      - Member
      x-use-case: UC-08
      security:
      - bearerAuth: []
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: 'Owner-filtered active review only. Omitted fields stay unchanged; empty text removes text; rating
        remains 1–5. Editing a hidden review does not make it visible.


        Use case: UC-08. Errors: 400 INVALID_REQUEST; 401 AUTHENTICATION_REQUIRED; 403 ROLE_DENIED; 404 RESOURCE_NOT_FOUND;
        409 STALE_VERSION; 415 UNSUPPORTED_MEDIA_TYPE; 500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.'
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '401':
        - AUTHENTICATION_REQUIRED
        '403':
        - ROLE_DENIED
        '404':
        - RESOURCE_NOT_FOUND
        '409':
        - STALE_VERSION
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
    delete:
      tags:
      - Reviews
      summary: Delete own review
      operationId: deleteOwnReview
      x-roles:
      - Member
      x-use-case: UC-08
      security:
      - bearerAuth: []
      parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expectedVersion
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: 'Soft-removes own active review and updates visible rating aggregates atomically. Repeated removal
        returns 404; a subsequent eligible create is allowed.


        Use case: UC-08. Errors: 400 INVALID_REQUEST; 401 AUTHENTICATION_REQUIRED; 403 ROLE_DENIED; 404 RESOURCE_NOT_FOUND;
        409 STALE_VERSION; 500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.'
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '401':
        - AUTHENTICATION_REQUIRED
        '403':
        - ROLE_DENIED
        '404':
        - RESOURCE_NOT_FOUND
        '409':
        - STALE_VERSION
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
  /seller/products:
    get:
      tags:
      - SellerCatalog
      summary: List own products
      operationId: listOwnProducts
      x-roles:
      - Seller
      x-use-case: UC-06
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      x-error-codes:
        '400':
        - INVALID_REQUEST
        - INVALID_CURSOR
        '401':
        - AUTHENTICATION_REQUIRED
        '403':
        - ROLE_DENIED
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
      description: '


        Use case: UC-06. Errors: 400 INVALID_REQUEST, INVALID_CURSOR; 401 AUTHENTICATION_REQUIRED; 403 ROLE_DENIED;
        500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.'
    post:
      tags:
      - SellerCatalog
      summary: Create own product
      operationId: createOwnProduct
      x-roles:
      - Seller
      x-use-case: UC-06
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
            example:
              name: Cotton shirt
              description: Cotton crew-neck shirt
              categoryId: 00000000-0000-4000-8000-000000000001
              published: false
              variants:
              - sku: SHIRT-BLUE-M
                label: Blue / M
                priceUsd: '12.50'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '401':
        - AUTHENTICATION_REQUIRED
        '403':
        - ROLE_DENIED
        - SELLER_INACTIVE
        '409':
        - STALE_VERSION
        - SKU_ALREADY_EXISTS
        - ITEM_UNAVAILABLE
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
      description: '


        Use case: UC-06. Errors: 400 INVALID_REQUEST; 401 AUTHENTICATION_REQUIRED; 403 ROLE_DENIED, SELLER_INACTIVE;
        409 STALE_VERSION, SKU_ALREADY_EXISTS, ITEM_UNAVAILABLE; 415 UNSUPPORTED_MEDIA_TYPE; 500 INTERNAL_ERROR;
        503 SERVICE_UNAVAILABLE.'
  /seller/products/{productId}:
    patch:
      tags:
      - SellerCatalog
      summary: Update own product
      operationId: updateOwnProduct
      x-roles:
      - Seller
      x-use-case: UC-06
      security:
      - bearerAuth: []
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '401':
        - AUTHENTICATION_REQUIRED
        '403':
        - ROLE_DENIED
        - SELLER_INACTIVE
        '404':
        - RESOURCE_NOT_FOUND
        '409':
        - STALE_VERSION
        - SKU_ALREADY_EXISTS
        - ITEM_UNAVAILABLE
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '500':
        - INTERNAL_ERROR
        '503':
        - SERVICE_UNAVAILABLE
      description: '


        Use case: UC-06. Errors: 400 INVALID_REQUEST; 401 AUTHENTICATION_REQUIRED; 403 ROLE_DENIED, SELLER_INACTIVE;
        404 RESOURCE_NOT_FOUND; 409 STALE_VERSION, SKU_ALREADY_EXISTS, ITEM_UNAVAILABLE; 415 UNSUPPORTED_MEDIA_TYPE;
        500 INTERNAL_ERROR; 503 SERVICE_UNAVAILABLE.'
    get:
      tags:
      - SellerCatalog
      summary: Get own product
      operationId: getOwnProduct
      x-use-case: UC-06
      x-roles:
      - Seller
      security:
      - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: 'Owner-filtered read includes unpublished products and stock versions. Available for reads while
